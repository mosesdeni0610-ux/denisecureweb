
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="logo">SecureWeb</div>
        <h2 id="judul">Selamat Datang!</h2>
        <p id="deskripsi">Silakan login ke akun Anda</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail"
                       placeholder="Masukkan email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Masukkan password" required>
            </div>

            <button type="submit">Login</button>

            <p class="switch">
                Belum punya akun?
                <a href="#" id="keRegister">Register</a>
            </p>
        </form>

        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama"
                       placeholder="Masukkan nama" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail"
                       placeholder="Masukkan email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword"
                       placeholder="Minimal 8 karakter"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="konfirmasiPassword"
                       placeholder="Ulangi password"
                       minlength="8" required>
            </div>

            <button type="submit">Buat Akun</button>

            <p class="switch">
                Sudah punya akun?
                <a href="#" id="keLogin">Login</a>
            </p>
        </form>

        <p id="pesan" role="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
