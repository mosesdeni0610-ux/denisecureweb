
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="logo">Website Deni</div>
        <h2 id="judul">Selamat Datang!</h2>
        <p id="deskripsi">Silakan login ke akun Anda</p>

        <form id="loginForm"> 
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail"
                       placeholder="Masukkan email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Masukkan password" required>
            </div>

            <button type="submit">Login</button>

            <p class="switch">
                Belum punya akun?
                <a href="#" id="keRegister">Register</a>
            </p>
        </form>

        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama"
                       placeholder="Masukkan nama" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail"
                       placeholder="Masukkan email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword"
                       placeholder="Minimal 8 karakter"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="konfirmasiPassword"
                       placeholder="Ulangi password"
                       minlength="8" required>
            </div>

            <button type="submit">Buat Akun</button>

            <p class="switch">
                Sudah punya akun?
                <a href="#" id="keLogin">Login</a>
            </p>
        </form>

        <p id="pesan" role="status"></p>
    </div>
    <!-- DASHBOARD PENGGUNA -->
<section id="dashboard" style="display: none;">
  <h1>Dashboard SecureWeb</h1>
  <p>Selamat datang di SecureWeb!</p>

  <div class="profile-card">
    <h2>Informasi Pengguna</h2>

    <p>Nama: <span id="dashboardNama">-</span></p>
    <p>Email: <span id="dashboardEmail">-</span></p>
    <p>Tanggal Bergabung:
      <span id="dashboardTanggal">-</span>
    </p>

    <button id="logoutButton">Logout</button>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
